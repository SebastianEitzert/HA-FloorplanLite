blueprint:
  name: Floorplan Lite – keys, clicks and wheel over a room
  description: >-
    The Floorplan Lite card sends every key, click, wheel step and tap over a room to this script as
    `{raum, aktion, lichter, player}`. Here you choose what each of them does – or nothing.


    **Scenes of a room** are the scenes assigned to its area and (optionally) the scenes whose name starts with the
    room's name, e.g. „Kitchen Evening“ or „Kitchen-Bright“. ↑/↓ step through them: off → first scenes → the others
    (alphabetical) → off. A scene named like one of the *off names* stands for „off“; without one the room's lights
    are switched off. A room without scenes simply switches its lights on and off. *Modes* (night, cinema, party …)
    put their scenes first while they are on – the topmost mode wins.


    **Music** goes to the room's players that are playing; play starts the standard players of the room (or all of
    them) when none is playing.
  domain: script
  source_url: https://github.com/SebastianEitzert/HA-FloorplanLite/blob/main/custom_components/floorplan_lite/blueprints/script/room_click.yaml
  input:
    keys:
      name: Keys and clicks
      description: What each event over a room does.
      input:
        hoch:
          name: "↑ (hoch)"
          default: scene_next
          selector: &actions
            select:
              mode: dropdown
              options:
                - { value: nothing, label: "Nothing" }
                - { value: scene_next, label: "Next scene (without scenes: light on/off)" }
                - { value: scene_previous, label: "Previous scene (without scenes: light on/off)" }
                - { value: light_toggle, label: "Light on/off (first scene / off)" }
                - { value: light_on, label: "Light on (first scene)" }
                - { value: light_off, label: "Light off" }
                - { value: room_off, label: "Room off (light off, music stop)" }
                - { value: music_play, label: "Music play" }
                - { value: music_pause, label: "Music pause" }
                - { value: music_toggle, label: "Music play/pause" }
                - { value: music_stop, label: "Music stop" }
                - { value: volume_up, label: "Louder" }
                - { value: volume_down, label: "Quieter" }
                - { value: next_track, label: "Next track" }
                - { value: previous_track, label: "Previous track" }
        runter: { name: "↓ (runter)", default: scene_previous, selector: *actions }
        lauter: { name: "Mouse wheel up (lauter)", default: volume_up, selector: *actions }
        leiser: { name: "Mouse wheel down (leiser)", default: volume_down, selector: *actions }
        gelb: { name: "Right click / yellow once (gelb)", default: nothing, selector: *actions }
        play: { name: "Play key (play)", default: music_play, selector: *actions }
        pause: { name: "Pause key (pause)", default: music_pause, selector: *actions }
        play_pause: { name: "Play/pause key (play_pause)", default: music_toggle, selector: *actions }
        stop: { name: "Stop key (stop)", default: music_stop, selector: *actions }
        weiter: { name: "Next track key (weiter)", default: next_track, selector: *actions }
        zurueck: { name: "Previous track key (zurueck)", default: previous_track, selector: *actions }
        blau:
          name: "Blue (blau)"
          description: >-
            ⚠ With the TV Streamer integration the streamer uses blue itself: it shows Home Assistant, and reloads it
            when it is shown already. What you choose here runs as well – only for things that may happen together
            with that.
          default: nothing
          selector: *actions
        gruen:
          name: "Green (gruen)"
          description: >-
            ⚠ With the TV Streamer integration the streamer uses green itself: it opens the tab chosen under
            „Green key“ in the streamer's options. Set that to „none“ to use green only here.
          default: nothing
          selector: *actions
        rot:
          name: "Red (rot)"
          description: >-
            ⚠ With the TV Streamer (Moonlight) red opens Moonlight's own menu and never reaches the page – it only
            works with other remotes or browsers that pass it on.
          default: nothing
          selector: *actions
        tipp2: { name: "Touch: double tap (tipp2)", default: light_toggle, selector: *actions }
        tipp3: { name: "Touch: triple tap (tipp3)", default: room_off, selector: *actions }
    twice:
      name: Keys pressed twice
      description: >-
        A key with an action for „twice“ waits for a second press before its single action runs. Keys set to
        „Nothing“ here react at once – the waiting time only counts where twice is in use.
      input:
        double_ms:
          name: Time for the second press
          default: 400
          selector: { number: { min: 200, max: 1000, step: 50, unit_of_measurement: ms, mode: slider } }
        hoch2: { name: "↑ twice (hoch2)", default: nothing, selector: *actions }
        runter2: { name: "↓ twice (runter2)", default: nothing, selector: *actions }
        gelb2: { name: "Right click / yellow twice (gelb2)", default: room_off, selector: *actions }
        play2: { name: "Play twice (play2)", default: next_track, selector: *actions }
        pause2: { name: "Pause twice (pause2)", default: nothing, selector: *actions }
        play_pause2: { name: "Play/pause twice (play_pause2)", default: nothing, selector: *actions }
        stop2: { name: "Stop twice (stop2)", default: nothing, selector: *actions }
        weiter2: { name: "Next track key twice (weiter2)", default: nothing, selector: *actions }
        zurueck2: { name: "Previous track key twice (zurueck2)", default: nothing, selector: *actions }
        blau2: { name: "Blue twice (blau2) – ⚠ TV Streamer, see Blue", default: nothing, selector: *actions }
        gruen2: { name: "Green twice (gruen2) – ⚠ TV Streamer, see Green", default: nothing, selector: *actions }
        rot2: { name: "Red twice (rot2) – ⚠ Moonlight, see Red", default: nothing, selector: *actions }
    music:
      name: Music
      input:
        volume_mode:
          name: Louder / quieter
          default: only_playing
          selector:
            select:
              options:
                - { value: only_playing, label: "Only while music plays (never starts it)" }
                - { value: always, label: "Always (players that play, else the standard players)" }
        standard_players:
          name: Standard players per area
          description: "Players that play starts when none is playing, e.g. `living_room: [media_player.ceiling]`. Without an entry: all players of the room."
          default: {}
          selector: { object: {} }
        music_integration:
          name: Only players of this integration (optional)
          description: e.g. `loxone` – leaves TVs and other players alone.
          default: ""
          selector: { text: {} }
    scenes:
      name: Scenes and light
      collapsed: true
      input:
        scenes_by_name:
          name: Scenes whose name starts with the room's name belong to it
          default: true
          selector: { boolean: {} }
        room_names:
          name: Scene name of a room (if it differs from the area's name)
          description: "e.g. `kids_room_1: Kid 1`"
          default: {}
          selector: { object: {} }
        off_names:
          name: Names of the „off“ scene
          default: [Off, Aus]
          selector: { text: { multiple: true } }
        first_names:
          name: Scenes that come first (in this order)
          default: []
          selector: { text: { multiple: true } }
        modes:
          name: Modes (top = highest priority)
          description: >-
            While a mode is on, its scenes come right after „off“, in the order given. Several modes on: the topmost
            one wins, the others follow. Modes that are off keep their scenes after the first scenes.
            `state` is optional (default `on`), e.g. for an input_select.


            ```

            - entity: switch.night_mode
              scenes: [Night]

            - entity: input_select.house_mode
              state: Cinema
              scenes: [TV, Netflix]
            ```
          default: []
          selector: { object: {} }
        light_integration:
          name: Only lights of this integration count (optional)
          description: e.g. `loxone` – a status LED in the room then does not keep it „on“.
          default: ""
          selector: { text: {} }

mode: parallel
max: 10
icon: mdi:gesture-tap-button
fields:
  raum:
    name: Room
    description: Area of the room
    required: true
    selector: { area: {} }
  aktion:
    name: Event
    description: >-
      hoch, runter, lauter, leiser, gelb, play, pause, play_pause, stop, weiter, zurueck, blau, gruen, rot, tipp2, tipp3,
      the same with 2 for twice (hoch2, gelb2 …) – or config: answers which keys use twice and the waiting time
    selector: { text: {} }
  lichter:
    name: Lights
    description: The room's lights from the floor plan (default – the area's lights)
    selector: { entity: { multiple: true } }
  player:
    name: Players
    description: The room's media players from the floor plan (default – the area's players)
    selector: { entity: { multiple: true, domain: media_player } }
  klicks:
    name: Clicks (older cards)
    selector: { number: { min: 2, max: 3, mode: box } }

variables:
  settings:
    hoch: !input hoch
    runter: !input runter
    lauter: !input lauter
    leiser: !input leiser
    gelb: !input gelb
    play: !input play
    pause: !input pause
    play_pause: !input play_pause
    stop: !input stop
    weiter: !input weiter
    zurueck: !input zurueck
    blau: !input blau
    gruen: !input gruen
    rot: !input rot
    tipp2: !input tipp2
    tipp3: !input tipp3
    hoch2: !input hoch2
    runter2: !input runter2
    gelb2: !input gelb2
    play2: !input play2
    pause2: !input pause2
    play_pause2: !input play_pause2
    stop2: !input stop2
    weiter2: !input weiter2
    zurueck2: !input zurueck2
    blau2: !input blau2
    gruen2: !input gruen2
    rot2: !input rot2
  double_ms: !input double_ms
  volume_mode: !input volume_mode
  standard_players: !input standard_players
  music_integration: !input music_integration
  scenes_by_name: !input scenes_by_name
  room_names: !input room_names
  off_names: !input off_names
  first_names: !input first_names
  modes: !input modes
  light_integration: !input light_integration

sequence:
  - alias: "The card asks which keys use „twice“ and how long it waits for the second press"
    if: "{{ aktion is defined and aktion == 'config' }}"
    then:
      - variables:
          answer:
            double: >-
              {{ settings.items() | selectattr('0', 'match', '.+2$') | rejectattr('0', 'eq', 'tipp2')
                 | rejectattr('1', 'eq', 'nothing') | map(attribute='0') | map('regex_replace', '2$', '') | list }}
            ms: "{{ double_ms | int(400) }}"
      - stop: config
        response_variable: answer
  - variables:
      event: >-
        {% set a = aktion if aktion is defined and aktion else '' %}
        {% set k = (klicks if klicks is defined else 0) | int(0) %}
        {{ 'play_pause' if a == 'musik' else a if a else 'tipp3' if k >= 3 else 'tipp2' if k == 2 else '' }}
      todo: "{{ settings.get(event, 'nothing') }}"
  - condition: template
    value_template: "{{ todo != 'nothing' }}"
  - variables:
      lights: >-
        {% set l = lichter if lichter is defined and lichter else area_entities(raum) | select('match', 'light\.') | list %}
        {{ l | select('in', integration_entities(light_integration)) | list if light_integration else l }}
      players: >-
        {% set p = player if player is defined and player else area_entities(raum) | select('match', 'media_player\.')
           | reject('is_state_attr', 'device_class', 'tv') | list %}
        {{ p | select('in', integration_entities(music_integration)) | list if music_integration else p }}
      prefix: "{{ room_names.get(raum, area_name(raum) or raum) }}"
      # [entity_id, short name] of the room's scenes
      scenes: >-
        {% set n = prefix | length %}
        {% set ns = namespace(l=[]) %}
        {% for s in states.scene | sort(attribute='name') %}
          {% if s.entity_id in area_entities(raum) %}
            {% set ns.l = ns.l + [[s.entity_id, s.name[n:] | trim(' -–:') if s.name[:n] | lower == prefix | lower else s.name]] %}
          {% elif scenes_by_name and n and s.name[:n] | lower == prefix | lower and s.name[n:n+1] in [' ', '-', '–', ':', '_'] %}
            {% set ns.l = ns.l + [[s.entity_id, s.name[n:] | trim(' -–:_')]] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
  - variables:
      low_off: "{{ off_names | map('lower') | list }}"
      # scenes of the modes: [active (topmost first), inactive], each in the order the modes list them
      mode_scenes: >-
        {% set ns = namespace(on=[], off=[]) %}
        {% for m in (modes if modes is iterable and modes is not string and modes is not mapping else []) %}
          {% set ids = namespace(l=[]) %}
          {% for name in (m.scenes if m.scenes is defined and m.scenes is not string else [m.scenes | default('')]) %}
            {% for s in scenes if s[1] | lower == name | string | lower %}{% set ids.l = ids.l + [s[0]] %}{% endfor %}
          {% endfor %}
          {% if m.entity is defined and is_state(m.entity, (m.state | default('on')) | string) %}{% set ns.on = ns.on + ids.l %}
          {% else %}{% set ns.off = ns.off + ids.l %}{% endif %}
        {% endfor %}
        {{ [ns.on, ns.off] }}
  - variables:
      # the cycle: off (scene, else „lights off“) → modes that are on → first scenes → other modes → the rest; without scenes: off ↔ on
      order: >-
        {% set ns = namespace(off='', first=[], rest=[]) %}
        {% set fl = first_names | map('lower') | list %}
        {% for s in scenes %}
          {% if s[1] | lower in low_off and not ns.off %}{% set ns.off = s[0] %}
          {% elif s[1] | lower in fl %}{% set ns.first = ns.first + [s] %}
          {% else %}{% set ns.rest = ns.rest + [s[0]] %}{% endif %}
        {% endfor %}
        {% set ns2 = namespace(f=[], l=[]) %}
        {% for name in fl %}{% for s in ns.first if s[1] | lower == name %}{% set ns2.f = ns2.f + [s[0]] %}{% endfor %}{% endfor %}
        {% for e in mode_scenes[0] + ns2.f + mode_scenes[1] + ns.rest if e != ns.off and e not in ns2.l %}
          {% set ns2.l = ns2.l + [e] %}
        {% endfor %}
        {{ [ns.off or 'lights_off'] + (ns2.l if ns2.l else ['lights_on']) }}
      light_on: >-
        {{ lights | select('is_state', 'on') | list | count > 0 }}
  - variables:
      current: >-
        {% set ns = namespace(id='', t='') %}
        {% for e in order if e.startswith('scene.') and has_value(e) and states(e) > ns.t %}
          {% set ns.t = states(e) %}{% set ns.id = e %}
        {% endfor %}
        {% set on = light_on if lights | count > 0 else (ns.id != '' and ns.id != order[0]) %}
        {% if not on %}0{% elif ns.id in order and ns.id != order[0] %}{{ order.index(ns.id) }}{% else %}1{% endif %}
      target: >-
        {% set n = order | count %}
        {% set i = current | int(0) %}
        {% if todo == 'scene_next' %}{{ order[(i + 1) % n] }}
        {% elif todo == 'scene_previous' %}{{ order[(i - 1 + n) % n] }}
        {% elif todo == 'light_toggle' %}{{ order[0] if i > 0 else order[1] }}
        {% elif todo == 'light_on' %}{{ order[1] if i == 0 else '' }}
        {% elif todo in ['light_off', 'room_off'] %}{{ order[0] }}
        {% endif %}
      playing: "{{ players | select('is_state', 'playing') | list }}"
      standard: >-
        {% set s = standard_players.get(raum, []) | select('in', players) | list %}
        {{ s if s else players }}
  - choose:
      - conditions: "{{ target.startswith('scene.') }}"
        sequence:
          - action: scene.turn_on
            target: { entity_id: "{{ target }}" }
      - conditions: "{{ target == 'lights_off' and lights | count > 0 }}"
        sequence:
          - action: homeassistant.turn_off
            target: { entity_id: "{{ lights }}" }
      - conditions: "{{ target == 'lights_on' and lights | count > 0 }}"
        sequence:
          - action: homeassistant.turn_on
            target: { entity_id: "{{ lights }}" }
  - choose:
      - conditions: "{{ todo in ['room_off', 'music_stop'] and players | count > 0 }}"
        sequence:
          - action: media_player.media_stop
            continue_on_error: true
            target: { entity_id: "{{ players }}" }
      - conditions: "{{ todo == 'music_play' or (todo == 'music_toggle' and playing | count == 0) }}"
        sequence:
          - condition: template
            value_template: "{{ (playing or standard) | count > 0 }}"
          - action: media_player.media_play
            continue_on_error: true
            target: { entity_id: "{{ playing if playing else standard }}" }
      - conditions: "{{ todo in ['music_pause', 'music_toggle'] and playing | count > 0 }}"
        sequence:
          - action: media_player.media_pause
            continue_on_error: true
            target: { entity_id: "{{ playing }}" }
      - conditions: "{{ todo in ['volume_up', 'volume_down'] }}"
        sequence:
          - variables:
              to: "{{ playing if playing or volume_mode == 'only_playing' else standard }}"
          - condition: template
            value_template: "{{ to | count > 0 }}"
          - action: "media_player.{{ todo }}"
            continue_on_error: true
            target: { entity_id: "{{ to }}" }
      - conditions: "{{ todo in ['next_track', 'previous_track'] and playing | count > 0 }}"
        sequence:
          - action: "media_player.media_{{ todo }}"
            continue_on_error: true
            target: { entity_id: "{{ playing }}" }
