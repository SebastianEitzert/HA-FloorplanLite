blueprint:
  name: Floorplan Lite – keys, clicks and wheel over a room
  description: >-
    The Floorplan Lite card sends every key, click, wheel step and tap over a room to this script as
    `{room, event, lights, players}`. Here you choose what each of them does – or nothing.


    **Scenes of a room** are the scenes assigned to its area and (optionally) the scenes whose name starts with the
    room's name, e.g. „Kitchen Evening“ or „Kitchen-Bright“. ↑/↓ step through them: off → first scenes → the others
    (alphabetical) → off. A scene named like one of the *off names* stands for „off“; without one the room's lights
    are switched off. A room without scenes simply switches its lights on and off. *Modes* (night, cinema, party …)
    put their scenes first while they are on – the topmost mode wins.


    **Music** goes to the room's players that are playing; play starts the standard players of the room (or all of
    them) when none is playing.


    **Which lights and players?** Exactly the ones entered for the room in the floor plan editor (light, main light –
    switches too, music), nothing else of the area. Only when the room has none there, the script takes the area's
    lights / players itself, limited by the allow / block lists below. Scenes switch whatever they contain; for them
    the room's lights only tell whether the room is on. A room set to take its entities live from its area also
    sends the area's lights (not its switches).
  domain: script
  source_url: https://github.com/SebastianEitzert/HA-FloorplanLite/blob/main/custom_components/floorplan_lite/blueprints/script/room_click.yaml
  input:
    pointer:
      name: "Pointer and arrow keys – mouse, PC keyboard, TV remote"
      description: >-
        With the pointer over a room. ↑/↓ are the arrow keys of a keyboard or the TV remote's D-pad, the wheel is the
        mouse wheel or the Magic Remote's wheel, right click is the right mouse button or the LG remote's yellow key.
      input:
        up:
          name: "↑ arrow up (up)"
          default: scene_next
          selector: &actions
            select:
              mode: dropdown
              options:
                - { value: nothing, label: "Nothing" }
                - { value: scene_next, label: "Next scene (without scenes: light on/off)" }
                - { value: scene_previous, label: "Previous scene (without scenes: light on/off)" }
                - { value: light_toggle, label: "Light on/off (first scene / off)" }
                - { value: light_on, label: "Light on (first scene)" }
                - { value: light_off, label: "Light off" }
                - { value: room_off, label: "Room off (light off, music stop)" }
                - { value: music_play, label: "Music play" }
                - { value: music_pause, label: "Music pause" }
                - { value: music_toggle, label: "Music play/pause" }
                - { value: music_stop, label: "Music stop" }
                - { value: volume_up, label: "Louder" }
                - { value: volume_down, label: "Quieter" }
                - { value: next_track, label: "Next track" }
                - { value: previous_track, label: "Previous track" }
        down: { name: "↓ arrow down (down)", default: scene_previous, selector: *actions }
        wheel_up: { name: "Wheel up (wheel_up)", default: volume_up, selector: *actions }
        wheel_down: { name: "Wheel down (wheel_down)", default: volume_down, selector: *actions }
        yellow: { name: "Right click / LG yellow (yellow)", default: nothing, selector: *actions }
    media:
      name: "Media keys – TV remote and PC keyboard"
      description: >-
        The LG remote has separate play and pause keys and stop (through the TV Streamer's Moonlight), but no track
        keys. A PC keyboard usually has one play/pause key, stop and next / previous track – they reach the card while
        its browser window has the focus.
      input:
        play: { name: "Play (play) – TV remote, some keyboards", default: music_play, selector: *actions }
        pause: { name: "Pause (pause) – TV remote, some keyboards", default: music_pause, selector: *actions }
        play_pause: { name: "Play/pause (play_pause) – PC keyboard", default: music_toggle, selector: *actions }
        stop: { name: "Stop (stop) – TV remote, PC keyboard", default: music_stop, selector: *actions }
        next: { name: "Next track (next) – PC keyboard", default: next_track, selector: *actions }
        previous: { name: "Previous track (previous) – PC keyboard", default: previous_track, selector: *actions }
    colours:
      name: "Colour keys – TV remote (TV Streamer)"
      collapsed: true
      description: >-
        Only LG remotes through the TV Streamer send these – and the streamer and Moonlight use them themselves, see
        each key.
      input:
        blue:
          name: "Blue (blue)"
          description: >-
            ⚠ The TV Streamer uses blue itself: it shows Home Assistant, and reloads it when it is shown already. What
            you choose here runs as well – only for things that may happen together with that.
          default: nothing
          selector: *actions
        green:
          name: "Green (green)"
          description: >-
            ⚠ The TV Streamer uses green itself: it opens the tab chosen under „Green key“ in the streamer's options.
            Set that to „none“ to use green only here.
          default: nothing
          selector: *actions
        red:
          name: "Red (red)"
          description: >-
            ⚠ Red opens Moonlight's own menu while streaming and never reaches the page – it only works with other
            remotes or browsers that pass it on.
          default: nothing
          selector: *actions
    touch:
      name: "Touch – phone, tablet"
      description: A single tap opens the room's pop-up; double and triple taps go here.
      input:
        double_tap: { name: "Double tap (double_tap)", default: light_toggle, selector: *actions }
        triple_tap: { name: "Triple tap (triple_tap)", default: room_off, selector: *actions }
    twice:
      name: "Pressed twice – arrow keys, right click, media and colour keys"
      description: >-
        A key with an action for „twice“ waits for a second press before its single action runs. Keys set to
        „Nothing“ here react at once – the waiting time only counts where twice is in use. (Touch has its own double
        tap above, the wheel has none.)
      input:
        double_ms:
          name: Time for the second press
          default: 400
          selector: { number: { min: 200, max: 1000, step: 50, unit_of_measurement: ms, mode: slider } }
        up_twice: { name: "↑ twice (up_twice)", default: nothing, selector: *actions }
        down_twice: { name: "↓ twice (down_twice)", default: nothing, selector: *actions }
        yellow_twice: { name: "Right click / LG yellow twice (yellow_twice)", default: room_off, selector: *actions }
        play_twice: { name: "Play twice (play_twice)", default: next_track, selector: *actions }
        pause_twice: { name: "Pause twice (pause_twice)", default: nothing, selector: *actions }
        play_pause_twice: { name: "Play/pause twice (play_pause_twice)", default: nothing, selector: *actions }
        stop_twice: { name: "Stop twice (stop_twice)", default: nothing, selector: *actions }
        next_twice: { name: "Next track twice (next_twice)", default: nothing, selector: *actions }
        previous_twice: { name: "Previous track twice (previous_twice)", default: nothing, selector: *actions }
        blue_twice: { name: "Blue twice (blue_twice) – ⚠ TV Streamer, see Blue", default: nothing, selector: *actions }
        green_twice: { name: "Green twice (green_twice) – ⚠ TV Streamer, see Green", default: nothing, selector: *actions }
        red_twice: { name: "Red twice (red_twice) – ⚠ Moonlight, see Red", default: nothing, selector: *actions }
    music:
      name: Music
      input:
        volume_mode:
          name: Louder / quieter
          default: only_playing
          selector:
            select:
              options:
                - { value: only_playing, label: "Only while music plays (never starts it)" }
                - { value: always, label: "Always (players that play, else the standard players)" }
        standard_players:
          name: Standard players per area
          description: "Players that play starts when none is playing, e.g. `living_room: [media_player.ceiling]`. Without an entry: all players of the room."
          default: {}
          selector: { object: {} }
    players_filter:
      name: "Music players – which ones count"
      collapsed: true
      description: >-
        The card sends the room's players from the floor plan. Only when it sends none (no players entered, or an
        older card) the area's media players are used (TVs never) – these lists say which of them count.
        Integrations by their internal name (domain), as in the address of the integration's page
        (…/config/integrations/integration/loxone): `loxone` for PyLoxone, `sonos`, `squeezebox` … An allow list
        that is not empty lets only its integrations and labels through; the block lists always win.
      input:
        players_plan_always:
          name: Players from the floor plan always count
          description: Off = the lists below also filter the players entered in the floor plan.
          default: true
          selector: { boolean: {} }
        players_allow_integrations:
          name: Allow – integrations
          default: []
          selector: { text: { multiple: true } }
        players_allow_labels:
          name: Allow – labels
          default: []
          selector: { label: { multiple: true } }
        players_block_integrations:
          name: Block – integrations
          default: []
          selector: { text: { multiple: true } }
        players_block_labels:
          name: Block – labels
          default: []
          selector: { label: { multiple: true } }
    scenes:
      name: Scenes and modes
      collapsed: true
      input:
        scenes_by_name:
          name: Scenes whose name starts with the room's name belong to it
          default: true
          selector: { boolean: {} }
        room_names:
          name: Scene name of a room (if it differs from the area's name)
          description: "e.g. `kids_room_1: Kid 1`"
          default: {}
          selector: { object: {} }
        off_names:
          name: Names of the „off“ scene
          default: [Off, Aus]
          selector: { text: { multiple: true } }
        first_names:
          name: Scenes that come first (in this order)
          default: []
          selector: { text: { multiple: true } }
        modes:
          name: Modes (top = highest priority)
          description: >-
            While a mode is on, its scenes come right after „off“, in the order given. Several modes on: the topmost
            one wins, the others follow. Modes that are off keep their scenes after the first scenes.
            `state` is optional (default `on`), e.g. for an input_select.


            ```

            - entity: switch.night_mode
              scenes: [Night]

            - entity: input_select.house_mode
              state: Cinema
              scenes: [TV, Netflix]
            ```
          default: []
          selector: { object: {} }
    lights_filter:
      name: "Lights – which ones count"
      collapsed: true
      description: >-
        The card sends the room's lights from the floor plan – switches chosen there as light or main light included.
        Only when it sends none (no lights entered, or an older card) the area's lights are used, plus switches and
        other entities of the area with an allowed label – these lists say which of them count. Integrations by their
        internal name (domain), as in the address of the integration's page
        (…/config/integrations/integration/loxone): `loxone` for PyLoxone, `shelly`, `hue`, `template` (template
        lights and switches), `group` (light groups) … An allow list that is not empty lets only its integrations
        and labels through; the block lists always win. Blocked entities neither switch nor keep the room „on“ (e.g. a
        status LED).
      input:
        lights_plan_always:
          name: Lights from the floor plan always count
          description: Off = the lists below also filter the lights entered in the floor plan.
          default: true
          selector: { boolean: {} }
        lights_allow_integrations:
          name: Allow – integrations
          default: []
          selector: { text: { multiple: true } }
        lights_allow_labels:
          name: Allow – labels
          default: []
          selector: { label: { multiple: true } }
        lights_block_integrations:
          name: Block – integrations
          default: []
          selector: { text: { multiple: true } }
        lights_block_labels:
          name: Block – labels
          default: []
          selector: { label: { multiple: true } }

mode: parallel
max: 10
icon: mdi:gesture-tap-button
fields:
  room:
    name: Room
    description: Area of the room
    required: true
    selector: { area: {} }
  event:
    name: Event
    description: >-
      up, down, wheel_up, wheel_down, yellow, play, pause, play_pause, stop, next, previous, blue, green, red,
      double_tap, triple_tap, the same with _twice for a key pressed twice (up_twice, yellow_twice …), off (the card's off
      buttons: always room off) – or config:
      answers which keys use twice and the waiting time
    selector: { text: {} }
  lights:
    name: Lights
    description: The room's lights from the floor plan (default – the area's lights)
    selector: { entity: { multiple: true } }
  players:
    name: Players
    description: The room's media players from the floor plan (default – the area's players)
    selector: { entity: { multiple: true, domain: media_player } }

variables:
  settings:
    up: !input up
    down: !input down
    wheel_up: !input wheel_up
    wheel_down: !input wheel_down
    yellow: !input yellow
    play: !input play
    pause: !input pause
    play_pause: !input play_pause
    stop: !input stop
    next: !input next
    previous: !input previous
    blue: !input blue
    green: !input green
    red: !input red
    double_tap: !input double_tap
    triple_tap: !input triple_tap
    up_twice: !input up_twice
    down_twice: !input down_twice
    yellow_twice: !input yellow_twice
    play_twice: !input play_twice
    pause_twice: !input pause_twice
    play_pause_twice: !input play_pause_twice
    stop_twice: !input stop_twice
    next_twice: !input next_twice
    previous_twice: !input previous_twice
    blue_twice: !input blue_twice
    green_twice: !input green_twice
    red_twice: !input red_twice
  double_ms: !input double_ms
  volume_mode: !input volume_mode
  standard_players: !input standard_players
  players_plan_always: !input players_plan_always
  players_allow_integrations: !input players_allow_integrations
  players_allow_labels: !input players_allow_labels
  players_block_integrations: !input players_block_integrations
  players_block_labels: !input players_block_labels
  scenes_by_name: !input scenes_by_name
  room_names: !input room_names
  off_names: !input off_names
  first_names: !input first_names
  modes: !input modes
  lights_plan_always: !input lights_plan_always
  lights_allow_integrations: !input lights_allow_integrations
  lights_allow_labels: !input lights_allow_labels
  lights_block_integrations: !input lights_block_integrations
  lights_block_labels: !input lights_block_labels

sequence:
  - alias: "The card asks which keys use „twice“ and how long it waits for the second press"
    if: "{{ event is defined and event == 'config' }}"
    then:
      - variables:
          answer:
            double: >-
              {{ settings.items() | selectattr('0', 'match', '.+_twice$')
                 | rejectattr('1', 'eq', 'nothing') | map(attribute='0') | map('regex_replace', '_twice$', '') | list }}
            ms: "{{ double_ms | int(400) }}"
      - stop: config
        response_variable: answer
  - variables:
      key: "{{ event if event is defined and event else '' }}"
      # off: the card's off buttons – always „room off“ (the room's off scene, else its lights off; music stop)
      todo: "{{ 'room_off' if key == 'off' else settings.get(key, 'nothing') }}"
  - condition: template
    value_template: "{{ todo != 'nothing' }}"
  - variables:
      # allow / block lists → [allowed, allowed by label, blocked, allow list in use]; no allow list = everything allowed
      light_lists: >-
        {% set ns = namespace(a=[], al=[], b=[]) %}
        {% for i in lights_allow_integrations or [] %}{% set ns.a = ns.a + integration_entities(i) %}{% endfor %}
        {% for l in lights_allow_labels or [] %}{% set ns.al = ns.al + label_entities(l) %}{% endfor %}
        {% for i in lights_block_integrations or [] %}{% set ns.b = ns.b + integration_entities(i) %}{% endfor %}
        {% for l in lights_block_labels or [] %}{% set ns.b = ns.b + label_entities(l) %}{% endfor %}
        {{ [ns.a + ns.al, ns.al, ns.b, (lights_allow_integrations or []) | count + (lights_allow_labels or []) | count > 0] }}
      player_lists: >-
        {% set ns = namespace(a=[], al=[], b=[]) %}
        {% for i in players_allow_integrations or [] %}{% set ns.a = ns.a + integration_entities(i) %}{% endfor %}
        {% for l in players_allow_labels or [] %}{% set ns.al = ns.al + label_entities(l) %}{% endfor %}
        {% for i in players_block_integrations or [] %}{% set ns.b = ns.b + integration_entities(i) %}{% endfor %}
        {% for l in players_block_labels or [] %}{% set ns.b = ns.b + label_entities(l) %}{% endfor %}
        {{ [ns.a + ns.al, ns.al, ns.b, (players_allow_integrations or []) | count + (players_allow_labels or []) | count > 0] }}
  - variables:
      use_lights: >-
        {% set area = area_entities(room) %}
        {% set plan = lights is defined and lights | count > 0 %}
        {% set l = lights if plan
             else (area | select('match', 'light\.') | list) + (light_lists[1] | select('in', area) | reject('match', 'light\.') | list) %}
        {% if plan and lights_plan_always %}{{ l }}
        {% else %}{{ (l | select('in', light_lists[0]) | list if light_lists[3] else l) | reject('in', light_lists[2]) | list }}{% endif %}
      use_players: >-
        {% set area = area_entities(room) %}
        {% set plan = players is defined and players | count > 0 %}
        {% set p = players if plan
             else (area | select('match', 'media_player\.') | reject('is_state_attr', 'device_class', 'tv') | list)
                  + (player_lists[1] | select('in', area) | select('match', 'media_player\.') | reject('in', area | select('match', 'media_player\.') | list) | list) %}
        {% if plan and players_plan_always %}{{ p }}
        {% else %}{{ (p | select('in', player_lists[0]) | list if player_lists[3] else p) | reject('in', player_lists[2]) | list }}{% endif %}
      prefix: "{{ room_names.get(room, area_name(room) or room) }}"
      # [entity_id, short name] of the room's scenes
      scenes: >-
        {% set n = prefix | length %}
        {% set ns = namespace(l=[]) %}
        {% for s in states.scene | sort(attribute='name') %}
          {% if s.entity_id in area_entities(room) %}
            {% set ns.l = ns.l + [[s.entity_id, s.name[n:] | trim(' -–:') if s.name[:n] | lower == prefix | lower else s.name]] %}
          {% elif scenes_by_name and n and s.name[:n] | lower == prefix | lower and s.name[n:n+1] in [' ', '-', '–', ':', '_'] %}
            {% set ns.l = ns.l + [[s.entity_id, s.name[n:] | trim(' -–:_')]] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
  - variables:
      low_off: "{{ off_names | map('lower') | list }}"
      # scenes of the modes: [active (topmost first), inactive], each in the order the modes list them
      mode_scenes: >-
        {% set ns = namespace(on=[], off=[]) %}
        {% for m in (modes if modes is iterable and modes is not string and modes is not mapping else []) %}
          {% set ids = namespace(l=[]) %}
          {% for name in (m.scenes if m.scenes is defined and m.scenes is not string else [m.scenes | default('')]) %}
            {% for s in scenes if s[1] | lower == name | string | lower %}{% set ids.l = ids.l + [s[0]] %}{% endfor %}
          {% endfor %}
          {% if m.entity is defined and is_state(m.entity, (m.state | default('on')) | string) %}{% set ns.on = ns.on + ids.l %}
          {% else %}{% set ns.off = ns.off + ids.l %}{% endif %}
        {% endfor %}
        {{ [ns.on, ns.off] }}
  - variables:
      # the cycle: off (scene, else „lights off“) → modes that are on → first scenes → other modes → the rest; without scenes: off ↔ on
      order: >-
        {% set ns = namespace(off='', first=[], rest=[]) %}
        {% set fl = first_names | map('lower') | list %}
        {% for s in scenes %}
          {% if s[1] | lower in low_off and not ns.off %}{% set ns.off = s[0] %}
          {% elif s[1] | lower in fl %}{% set ns.first = ns.first + [s] %}
          {% else %}{% set ns.rest = ns.rest + [s[0]] %}{% endif %}
        {% endfor %}
        {% set ns2 = namespace(f=[], l=[]) %}
        {% for name in fl %}{% for s in ns.first if s[1] | lower == name %}{% set ns2.f = ns2.f + [s[0]] %}{% endfor %}{% endfor %}
        {% for e in mode_scenes[0] + ns2.f + mode_scenes[1] + ns.rest if e != ns.off and e not in ns2.l %}
          {% set ns2.l = ns2.l + [e] %}
        {% endfor %}
        {{ [ns.off or 'lights_off'] + (ns2.l if ns2.l else ['lights_on']) }}
      light_on: >-
        {{ use_lights | select('is_state', 'on') | list | count > 0 }}
  - variables:
      current: >-
        {% set ns = namespace(id='', t='') %}
        {% for e in order if e.startswith('scene.') and has_value(e) and states(e) > ns.t %}
          {% set ns.t = states(e) %}{% set ns.id = e %}
        {% endfor %}
        {% set on = light_on if use_lights | count > 0 else (ns.id != '' and ns.id != order[0]) %}
        {% if not on %}0{% elif ns.id in order and ns.id != order[0] %}{{ order.index(ns.id) }}{% else %}1{% endif %}
      target: >-
        {% set n = order | count %}
        {% set i = current | int(0) %}
        {% if todo == 'scene_next' %}{{ order[(i + 1) % n] }}
        {% elif todo == 'scene_previous' %}{{ order[(i - 1 + n) % n] }}
        {% elif todo == 'light_toggle' %}{{ order[0] if i > 0 else order[1] }}
        {% elif todo == 'light_on' %}{{ order[1] if i == 0 else '' }}
        {% elif todo in ['light_off', 'room_off'] %}{{ order[0] }}
        {% endif %}
      playing: "{{ use_players | select('is_state', 'playing') | list }}"
      standard: >-
        {% set s = standard_players.get(room, []) | select('in', use_players) | list %}
        {{ s if s else use_players }}
  - choose:
      - conditions: "{{ target.startswith('scene.') }}"
        sequence:
          - action: scene.turn_on
            target: { entity_id: "{{ target }}" }
      - conditions: "{{ target == 'lights_off' and use_lights | count > 0 }}"
        sequence:
          - action: homeassistant.turn_off
            target: { entity_id: "{{ use_lights }}" }
      - conditions: "{{ target == 'lights_on' and use_lights | count > 0 }}"
        sequence:
          - action: homeassistant.turn_on
            target: { entity_id: "{{ use_lights }}" }
  - choose:
      - conditions: "{{ todo in ['room_off', 'music_stop'] and use_players | count > 0 }}"
        sequence:
          - action: media_player.media_stop
            continue_on_error: true
            target: { entity_id: "{{ use_players }}" }
      - conditions: "{{ todo == 'music_play' or (todo == 'music_toggle' and playing | count == 0) }}"
        sequence:
          - condition: template
            value_template: "{{ (playing or standard) | count > 0 }}"
          - action: media_player.media_play
            continue_on_error: true
            target: { entity_id: "{{ playing if playing else standard }}" }
      - conditions: "{{ todo in ['music_pause', 'music_toggle'] and playing | count > 0 }}"
        sequence:
          - action: media_player.media_pause
            continue_on_error: true
            target: { entity_id: "{{ playing }}" }
      - conditions: "{{ todo in ['volume_up', 'volume_down'] }}"
        sequence:
          - variables:
              to: "{{ playing if playing or volume_mode == 'only_playing' else standard }}"
          - condition: template
            value_template: "{{ to | count > 0 }}"
          - action: "media_player.{{ todo }}"
            continue_on_error: true
            target: { entity_id: "{{ to }}" }
      - conditions: "{{ todo in ['next_track', 'previous_track'] and playing | count > 0 }}"
        sequence:
          - action: "media_player.media_{{ todo }}"
            continue_on_error: true
            target: { entity_id: "{{ playing }}" }
